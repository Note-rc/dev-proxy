<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a2370"/>
      <stop offset="50%" style="stop-color:#233895"/>
      <stop offset="100%" style="stop-color:#3a4fb8"/>
    </linearGradient>
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.12"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.04"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="800" fill="url(#bg)"/>

  <!-- Decorative circles -->
  <circle cx="100" cy="700" r="200" fill="#ffffff" opacity="0.03"/>
  <circle cx="1200" cy="100" r="300" fill="#ffffff" opacity="0.03"/>
  <circle cx="900" cy="600" r="150" fill="#ffffff" opacity="0.02"/>

  <!-- Grid pattern -->
  <g opacity="0.05">
    <line x1="0" y1="100" x2="1280" y2="100" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="200" x2="1280" y2="200" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="300" x2="1280" y2="300" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="400" x2="1280" y2="400" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="500" x2="1280" y2="500" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="600" x2="1280" y2="600" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="700" x2="1280" y2="700" stroke="#fff" stroke-width="0.5"/>
    <line x1="200" y1="0" x2="200" y2="800" stroke="#fff" stroke-width="0.5"/>
    <line x1="400" y1="0" x2="400" y2="800" stroke="#fff" stroke-width="0.5"/>
    <line x1="600" y1="0" x2="600" y2="800" stroke="#fff" stroke-width="0.5"/>
    <line x1="800" y1="0" x2="800" y2="800" stroke="#fff" stroke-width="0.5"/>
    <line x1="1000" y1="0" x2="1000" y2="800" stroke="#fff" stroke-width="0.5"/>
  </g>

  <!-- Left content area -->
  <!-- Title -->
  <text x="100" y="260" font-family="SF Pro Display, -apple-system, sans-serif" font-size="72" font-weight="700" fill="#ffffff" letter-spacing="-1">Dev Proxy</text>
  <text x="100" y="330" font-family="SF Pro Display, -apple-system, sans-serif" font-size="28" fill="#ffffff" opacity="0.8">Developer Toolkit for Chrome</text>

  <!-- Description -->
  <text x="100" y="400" font-family="SF Pro Display, -apple-system, sans-serif" font-size="20" fill="#ffffff" opacity="0.65">A powerful proxy and debugging extension for front-end developers.</text>
  <text x="100" y="435" font-family="SF Pro Display, -apple-system, sans-serif" font-size="20" fill="#ffffff" opacity="0.65">Manage headers, redirects, scripts, and proxy with ease.</text>

  <!-- Feature tags -->
  <rect x="100" y="480" width="160" height="40" rx="20" fill="#ffffff" opacity="0.15"/>
  <text x="180" y="506" font-family="SF Pro Display, -apple-system, sans-serif" font-size="15" fill="#ffffff" text-anchor="middle" opacity="0.9">Header Modify</text>

  <rect x="280" y="480" width="160" height="40" rx="20" fill="#ffffff" opacity="0.15"/>
  <text x="360" y="506" font-family="SF Pro Display, -apple-system, sans-serif" font-size="15" fill="#ffffff" text-anchor="middle" opacity="0.9">Proxy Server</text>

  <rect x="460" y="480" width="160" height="40" rx="20" fill="#ffffff" opacity="0.15"/>
  <text x="540" y="506" font-family="SF Pro Display, -apple-system, sans-serif" font-size="15" fill="#ffffff" text-anchor="middle" opacity="0.9">Script Replace</text>

  <rect x="100" y="535" width="150" height="40" rx="20" fill="#ffffff" opacity="0.15"/>
  <text x="175" y="561" font-family="SF Pro Display, -apple-system, sans-serif" font-size="15" fill="#ffffff" text-anchor="middle" opacity="0.9">JS Redirect</text>

  <rect x="270" y="535" width="170" height="40" rx="20" fill="#ffffff" opacity="0.15"/>
  <text x="355" y="561" font-family="SF Pro Display, -apple-system, sans-serif" font-size="15" fill="#ffffff" text-anchor="middle" opacity="0.9">Route Replace</text>

  <rect x="460" y="535" width="170" height="40" rx="20" fill="#ffffff" opacity="0.15"/>
  <text x="545" y="561" font-family="SF Pro Display, -apple-system, sans-serif" font-size="15" fill="#ffffff" text-anchor="middle" opacity="0.9">Scene Profiles</text>

  <!-- Right side: Mock UI card -->
  <g transform="translate(700, 140)">
    <!-- Browser window frame -->
    <rect x="0" y="0" width="480" height="520" rx="12" fill="#1e1e2e" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1"/>
    <!-- Title bar -->
    <rect x="0" y="0" width="480" height="36" rx="12" fill="#2d2d3d"/>
    <rect x="0" y="24" width="480" height="12" fill="#2d2d3d"/>
    <circle cx="20" cy="18" r="6" fill="#ff5f57"/>
    <circle cx="40" cy="18" r="6" fill="#febc2e"/>
    <circle cx="60" cy="18" r="6" fill="#28c840"/>

    <!-- Tab bar -->
    <rect x="16" y="48" width="448" height="32" rx="6" fill="#ffffff" opacity="0.05"/>
    <rect x="24" y="54" width="70" height="20" rx="4" fill="#233895"/>
    <text x="59" y="68" font-family="SF Mono, monospace" font-size="10" fill="#ffffff" text-anchor="middle">Header</text>
    <rect x="102" y="54" width="60" height="20" rx="4" fill="#ffffff" opacity="0.08"/>
    <text x="132" y="68" font-family="SF Mono, monospace" font-size="10" fill="#ffffff" opacity="0.6" text-anchor="middle">Route</text>
    <rect x="170" y="54" width="60" height="20" rx="4" fill="#ffffff" opacity="0.08"/>
    <text x="200" y="68" font-family="SF Mono, monospace" font-size="10" fill="#ffffff" opacity="0.6" text-anchor="middle">Script</text>
    <rect x="238" y="54" width="70" height="20" rx="4" fill="#ffffff" opacity="0.08"/>
    <text x="273" y="68" font-family="SF Mono, monospace" font-size="10" fill="#ffffff" opacity="0.6" text-anchor="middle">Redirect</text>
    <rect x="316" y="54" width="60" height="20" rx="4" fill="#ffffff" opacity="0.08"/>
    <text x="346" y="68" font-family="SF Mono, monospace" font-size="10" fill="#ffffff" opacity="0.6" text-anchor="middle">Proxy</text>

    <!-- Header rules -->
    <text x="24" y="110" font-family="SF Mono, monospace" font-size="11" fill="#ffffff" opacity="0.5">Configured Rules (3)</text>

    <!-- Rule 1 -->
    <rect x="16" y="120" width="448" height="56" rx="6" fill="#ffffff" opacity="0.06"/>
    <rect x="28" y="136" width="14" height="14" rx="3" fill="#233895"/>
    <text x="35" y="147" font-family="SF Mono, monospace" font-size="9" fill="#fff" text-anchor="middle">&#x2713;</text>
    <text x="52" y="147" font-family="SF Mono, monospace" font-size="12" fill="#ffffff" opacity="0.9">X-Custom-Token: Bearer abc123...</text>
    <text x="52" y="165" font-family="SF Mono, monospace" font-size="10" fill="#ffffff" opacity="0.4">Match: *api.example.com*</text>

    <!-- Rule 2 -->
    <rect x="16" y="184" width="448" height="56" rx="6" fill="#ffffff" opacity="0.06"/>
    <rect x="28" y="200" width="14" height="14" rx="3" fill="#233895"/>
    <text x="35" y="211" font-family="SF Mono, monospace" font-size="9" fill="#fff" text-anchor="middle">&#x2713;</text>
    <text x="52" y="211" font-family="SF Mono, monospace" font-size="12" fill="#ffffff" opacity="0.9">X-Debug-Mode: enabled</text>
    <text x="52" y="229" font-family="SF Mono, monospace" font-size="10" fill="#ffffff" opacity="0.4">Match: all requests</text>

    <!-- Rule 3 (disabled) -->
    <rect x="16" y="248" width="448" height="56" rx="6" fill="#ffffff" opacity="0.03"/>
    <rect x="28" y="264" width="14" height="14" rx="3" fill="#ffffff" opacity="0.2" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1"/>
    <text x="52" y="275" font-family="SF Mono, monospace" font-size="12" fill="#ffffff" opacity="0.4">Authorization: Bearer test_key</text>
    <text x="52" y="293" font-family="SF Mono, monospace" font-size="10" fill="#ffffff" opacity="0.25">Match: *staging.api.com*</text>

    <!-- Scene switcher -->
    <rect x="16" y="330" width="448" height="36" rx="6" fill="#ffffff" opacity="0.04"/>
    <rect x="24" y="338" width="90" height="20" rx="4" fill="#233895"/>
    <text x="69" y="352" font-family="SF Mono, monospace" font-size="10" fill="#ffffff" text-anchor="middle">Production</text>
    <rect x="122" y="338" width="70" height="20" rx="4" fill="#ffffff" opacity="0.1"/>
    <text x="157" y="352" font-family="SF Mono, monospace" font-size="10" fill="#ffffff" opacity="0.5" text-anchor="middle">Staging</text>
    <rect x="200" y="338" width="50" height="20" rx="4" fill="#ffffff" opacity="0.1"/>
    <text x="225" y="352" font-family="SF Mono, monospace" font-size="10" fill="#ffffff" opacity="0.5" text-anchor="middle">Dev</text>

    <!-- Add rule button -->
    <rect x="16" y="384" width="448" height="36" rx="6" fill="#233895"/>
    <text x="240" y="407" font-family="SF Pro Display, -apple-system, sans-serif" font-size="13" fill="#ffffff" text-anchor="middle">+ Add New Rule</text>

    <!-- Status bar -->
    <rect x="16" y="440" width="448" height="60" rx="6" fill="#ffffff" opacity="0.03"/>
    <circle cx="36" cy="470" r="6" fill="#28c840"/>
    <text x="52" y="474" font-family="SF Mono, monospace" font-size="11" fill="#ffffff" opacity="0.6">3 rules active | Scene: Production</text>
    <text x="52" y="492" font-family="SF Mono, monospace" font-size="10" fill="#ffffff" opacity="0.35">Last updated: just now</text>
  </g>

  <!-- Bottom badge -->
  <text x="100" y="700" font-family="SF Pro Display, -apple-system, sans-serif" font-size="16" fill="#ffffff" opacity="0.4">Manifest V3 | Open Source | Lightweight</text>
</svg>
